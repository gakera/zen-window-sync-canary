name: Windows released-browser sync canary
run-name: Zen canary · ${{ inputs.release || 'latest stable' }}
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      release:
        description: Zen stable release tag, or latest
        default: latest
        required: true
      force:
        description: Retest even if this release and suite already have a result
        type: boolean
        default: true
permissions:
  contents: read
env:
  STATUS_ISSUE: '1'
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      should_run: ${{ steps.release.outputs.should_run }}
      release: ${{ steps.release.outputs.release }}
      release_json: ${{ steps.release.outputs.release_json }}
      suite_id: ${{ steps.release.outputs.suite_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - id: release
        name: Detect release and decide whether Windows testing is needed
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE: ${{ inputs.release || 'latest' }}
          FORCE_RETEST: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: python reporting.py discover
  probe:
    needs: discover
    if: needs.discover.outputs.should_run == 'true'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Check released Windows browser and synchronized live state
        env:
          ZEN_RELEASE: ${{ needs.discover.outputs.release }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python probe.py
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-feasibility-${{ github.run_id }}
          path: evidence/
          retention-days: 7
          if-no-files-found: error
  record:
    needs: [discover, probe]
    if: always() && needs.discover.outputs.should_run == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          name: windows-feasibility-${{ github.run_id }}
          path: evidence/
      - name: Publish result and enforce PASS / FAIL / UNVERIFIED
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SELECTED_RELEASE: ${{ needs.discover.outputs.release_json }}
          SELECTED_SUITE: ${{ needs.discover.outputs.suite_id }}
          PROBE_RESULT: ${{ needs.probe.result }}
        run: python reporting.py record
      - name: Preserve compact result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-result-${{ github.run_id }}
          path: evidence/result.json
          retention-days: 90
          if-no-files-found: error
  dashboard:
    needs: [discover, probe, record]
    if: always() && github.ref == 'refs/heads/main'
    concurrency:
      group: canary-status-issue
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Refresh latest-stable dashboard from durable result comments
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python reporting.py refresh

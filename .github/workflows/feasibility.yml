name: Windows release feasibility
on:
  workflow_dispatch:
    inputs:
      release:
        description: Zen stable release tag, or latest
        default: latest
        required: true
permissions:
  contents: read
concurrency:
  group: feasibility-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Probe released Windows binary
        env:
          ZEN_RELEASE: ${{ inputs.release }}
        run: python probe.py
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-feasibility-${{ github.run_id }}
          path: evidence/
          retention-days: 7
          if-no-files-found: error
